<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#101228" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Alien Arena" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Alien Arena</title>
    <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="hud" aria-label="Game status">
        <div>
          <span class="label">Alien Arena</span>
          <strong id="stageLabel">Choose Alien</strong>
        </div>
        <div>
          <span class="label">Hull</span>
          <strong id="healthLabel">3</strong>
        </div>
        <div>
          <span class="label">Score</span>
          <strong id="scoreLabel">0</strong>
        </div>
        <button id="restartButton" type="button" title="Restart">Restart</button>
        <button id="leaderboardButton" type="button" title="Leaderboard">Scores</button>
      </section>

      <canvas id="gameCanvas" width="1280" height="720" aria-label="Alien Arena game canvas"></canvas>

      <section class="controls" aria-label="Game controls">
        <div class="dpad" aria-label="Movement controls">
          <button id="leftButton" class="control-button dpad-button" type="button" title="Dodge left" aria-label="Dodge left">Left</button>
          <button id="rightButton" class="control-button dpad-button" type="button" title="Dodge right" aria-label="Dodge right">Right</button>
        </div>
        <button id="shootButton" class="control-button fire-button" type="button" title="Fire laser" aria-label="Fire laser">Fire</button>
      </section>

      <section id="leaderboardOverlay" class="leaderboard-overlay" aria-label="Leaderboard" hidden>
        <div class="leaderboard-panel">
          <div class="leaderboard-header">
            <span class="label">Alien Arena</span>
            <strong id="leaderboardTitle">Leaderboard</strong>
          </div>

          <form id="scoreForm" class="score-form" hidden>
            <label for="playerName">Top 10 score! Enter name</label>
            <div class="score-row">
              <input id="playerName" name="playerName" maxlength="20" autocomplete="off" />
              <button id="saveScoreButton" type="submit">Save</button>
            </div>
          </form>

          <ol id="leaderboardList" class="leaderboard-list"></ol>
          <p id="recentScoreText" class="recent-score"></p>

          <div class="leaderboard-actions">
            <button id="closeLeaderboardButton" type="button">Close</button>
            <button id="playAgainButton" type="button">Play Again</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
